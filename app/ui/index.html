<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H3 影栈</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="5" width="13" height="14" rx="3"/>
          <path d="M15.5 10.5 21 7.5v9l-5.5-3z"/>
          <circle cx="9" cy="12" r="2.4"/>
        </svg>
      </div>
      <div class="brand-txt">
        <b>H3 影栈</b>
        <span>本地 AI 视频工坊</span>
      </div>
    </div>

    <div class="statusbar">
      <div class="engine-wrap">
        <button class="engine-pill" id="pillEngine">
          <i class="dot"></i>
          <div class="ep-txt">
            <b id="engMain">检测引擎…</b>
            <small id="engSub">ComfyUI</small>
          </div>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="engine-pop" id="enginePop">
          <div class="ep-head">
            <span>引擎 · ComfyUI</span>
            <b id="epState">检测中</b>
          </div>
          <div class="ep-rows" id="epRows"></div>
          <div class="ep-msg" id="epMsg"></div>
          <div class="ep-acts">
            <button class="mini-solid" id="btnEngStart">启动引擎</button>
            <button class="mini-ghost" id="btnEngStop">关闭引擎</button>
          </div>
          <div class="ep-links">
            <button id="btnEngOpen">打开 ComfyUI 网页</button>
            <button id="btnEngLog">查看日志</button>
          </div>
        </div>
      </div>
      <div class="pill ghost" id="pillGpu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h4M7 14h7"/></svg>
        <span>显卡 —</span>
      </div>
    </div>

    <div class="topactions">
      <button class="ghost-btn" id="btnFolder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l1.8 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        成品文件夹
      </button>
      <button class="icon-btn" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H7a1.7 1.7 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V7a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="body">
    <aside class="rail">
      <div class="rail-title">选一个玩法</div>
      <div id="modeList" class="mode-list"></div>
      <div class="rail-foot">
        <div class="rail-title hist-title">
          <span>我的作品</span>
          <button class="hist-batch-btn" id="btnBatchMode" title="批量管理作品">批量</button>
          <span class="hist-batch-bar" id="batchBar" hidden>
            <button class="hbb" id="btnSelAll" title="全选 / 全不选">全选</button>
            <button class="hbb danger" id="btnBatchDel" title="删除选中的作品">删<b id="selCount">0</b></button>
            <button class="hbb" id="btnBatchExit" title="退出批量模式">✕</button>
          </span>
        </div>
        <div id="historyList" class="hist-list">
          <div class="hist-empty">还没有作品</div>
        </div>
      </div>
    </aside>

    <main class="stage" id="stage">
      <div class="stage-inner">
        <div class="mode-head" id="modeHead"></div>
        <div class="form" id="formArea"></div>
        <div class="submit-bar">
          <div class="hint" id="submitHint">填好上面的内容，点右边按钮开始</div>
          <button class="primary" id="btnGenerate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5 19 12 5 20.5z"/></svg>
            <span>开始生成</span>
          </button>
        </div>
      </div>
    </main>

    <aside class="dock">
      <div class="dock-head">
        <span>任务与成品</span>
        <span class="dock-count" id="dockCount">0</span>
      </div>
      <div class="player-card" id="playerCard">
        <div class="player-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M10 9.2 15 12l-5 2.8z"/></svg>
          <p>生成的视频会在这里播放</p>
        </div>
      </div>
      <div class="task-list" id="taskList"></div>
    </aside>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <div class="modal" id="modalSettings">
    <div class="modal-card">
      <div class="modal-head">
        <b>设置</b>
        <button class="icon-btn" id="btnCloseSettings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="f-label">ComfyUI 安装位置</span>
          <input type="text" id="cfgRoot" placeholder="例如 E:/.../ComfyUI-aki-v3">
          <small class="f-tip">填写包含 python 和 ComfyUI 两个文件夹的那一层目录</small>
        </label>
        <label class="field">
          <span class="f-label">成品保存位置</span>
          <input type="text" id="cfgOut" placeholder="留空则放在 ComfyUI/output/H3影栈">
        </label>
        <label class="field">
          <span class="f-label">端口</span>
          <input type="text" id="cfgPort">
          <small class="f-tip">ComfyUI 内部通信端口，默认 8188，一般不用改</small>
        </label>
        <label class="switch-row">
          <input type="checkbox" id="cfgAuto">
          <span>打开程序时自动启动引擎</span>
        </label>
        <div class="mount-box">
          <button class="ghost-btn" id="btnMount">挂接自带模型包</button>
          <small class="f-tip">新电脑部署用：先填好上面的 ComfyUI 位置再点这里，
            会自动把本程序自带的模型目录挂到 ComfyUI（写 extra_model_paths.yaml），
            无需往 ComfyUI 里复制 60 多 G 的模型。点完重启 ComfyUI 生效。</small>
        </div>
      </div>
      <div class="modal-foot">
        <button class="ghost-btn" id="btnSaveSettings">保存</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modalLog">
    <div class="modal-card wide">
      <div class="modal-head">
        <b>引擎日志（最近 80 行）</b>
        <button class="icon-btn" id="btnCloseLog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <pre class="log-pre" id="logPre">读取中…</pre>
    </div>
  </div>
</div>
<script src="/ui/app.js"></script>
</body>
</html>
